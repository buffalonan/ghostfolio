# Fork only (not upstream): tests the backup restore check in fork/backup/.
name: Fork backup check

on:
  pull_request:
    paths: ['fork/backup/**', '.github/workflows/fork-backup-check.yml']
  push:
    branches: [main]
    paths: ['fork/backup/**', '.github/workflows/fork-backup-check.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Restore check tests
        run: sh fork/backup/test-check-backup.sh
